<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600" viewBox="0 0 480 600" role="img" aria-labelledby="title desc">
<title id="title">Sequential boosting with learnable feature transforms</title>
<desc id="desc">Algorithm 1 of the paper. Initialize F0 to zero and Q0 to the identity. At stage k, compute residuals y minus F k minus 1, fit a soft tree on the transformed features and those residuals, update Q k by gradient descent, then add the tree prediction to the ensemble. The updated ensemble determines the next stage's residuals.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#3355d6"/></marker></defs>
<rect width="480" height="600" rx="10" fill="#f6f7f9"/><g font-family="Arial,sans-serif"><text x="28" y="34" font-size="11" fill="#6b7180" font-weight="600">SEQUENTIAL BOOSTING</text><text x="28" y="68" font-size="23" fill="#1c2230" font-weight="600">Residual-based training</text><text x="28" y="99" font-size="15" fill="#434a5a" font-weight="400">Initialize F₀ = 0 and Q₀ = I</text><rect x="28" y="125" width="424" height="122" rx="6" fill="white" stroke="#c9ccd3"/><text x="46" y="151" font-size="15" fill="#3355d6" font-weight="600">Stage 1</text><text x="46" y="178" font-size="16" fill="#1c2230" font-weight="400">Residual: r₁ = y − F₀</text><text x="46" y="205" font-size="16" fill="#1c2230" font-weight="400">Fit soft tree f₁; update Q₁</text><text x="46" y="231" font-size="16" fill="#1c2230" font-weight="400">F₁(x) = F₀(x) + f₁(Q₁x)</text><path d="M240 247V274" fill="none" stroke="#3355d6" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="28" y="280" width="424" height="122" rx="6" fill="white" stroke="#c9ccd3"/><text x="46" y="306" font-size="15" fill="#3355d6" font-weight="600">Stage 2</text><text x="46" y="333" font-size="16" fill="#1c2230" font-weight="400">Residual: r₂ = y − F₁</text><text x="46" y="360" font-size="16" fill="#1c2230" font-weight="400">Fit soft tree f₂; update Q₂</text><text x="46" y="386" font-size="16" fill="#1c2230" font-weight="400">F₂(x) = F₁(x) + f₂(Q₂x)</text><path d="M240 402V441" fill="none" stroke="#3355d6" stroke-width="1.7" marker-end="url(#arrow)"/><text x="258" y="430" font-size="24" fill="#6b7180" font-weight="400">⋮</text><rect x="28" y="449" width="424" height="64" rx="6" fill="white" stroke="#c9ccd3"/><text x="46" y="475" font-size="15" fill="#3355d6" font-weight="600">Continue to stage K</text><text x="46" y="499" font-size="16" fill="#1c2230" font-weight="400">Fₖ(x) = Fₖ₋₁(x) + fₖ(Qₖx)</text><text x="28" y="551" font-size="14" fill="#434a5a" font-weight="400">Each new tree fits the current residuals.</text><text x="28" y="575" font-size="12" fill="#6b7180" font-weight="400">Training procedure in the paper · Algorithm 1</text></g></svg>
