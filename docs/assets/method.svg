<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
<title id="title">BSDT-Q: learn the features and the trees together</title>
<desc id="desc">An input feature vector feeds parallel learnable linear transforms Q1 through QK. Each transformed vector enters a soft decision tree. The tree outputs are added to form a prediction. A dashed arrow shows the differentiable loss sending gradients back to the transforms and trees. Schematic, not measured feature weights.</desc>
