<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc">
<title id="title">Sequential boosting with learnable feature transforms</title>
<desc id="desc">Algorithm 1 of the paper. Initialize F0 to zero and Q0 to the identity. At stage k, compute residuals y minus F k minus 1, fit a soft tree on the transformed features and those residuals, update Q k by gradient descent, then add the tree prediction to the ensemble. The updated ensemble determines the next stage's residuals.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#3355d6"/></marker></defs>
<rect width="1000" height="370" rx="10" fill="#f6f7f9"/><g font-family="Arial,sans-serif"><text x="32" y="36" font-size="12" fill="#6b7180" font-weight="600">SEQUENTIAL BOOSTING · ALGORITHM 1</text><text x="32" y="74" font-size="24" fill="#1c2230" font-weight="600">Residual-based training with a learnable feature transform</text><text x="32" y="109" font-size="16" fill="#434a5a" font-weight="400">Initialize F₀ = 0 and Q₀ = I. Each stage adds a tree fitted to the current residuals.</text><rect x="32" y="145" width="292" height="144" rx="6" fill="white" stroke="#c9ccd3"/><text x="50" y="174" font-size="16" fill="#3355d6" font-weight="600">Stage 1</text><text x="50" y="204" font-size="17" fill="#1c2230" font-weight="400">r₁ = y − F₀</text><text x="50" y="233" font-size="16" fill="#1c2230" font-weight="400">Fit soft tree f₁; update Q₁</text><text x="50" y="265" font-size="16" fill="#1c2230" font-weight="400">F₁(x) = F₀(x) + f₁(Q₁x)</text><rect x="354" y="145" width="292" height="144" rx="6" fill="white" stroke="#c9ccd3"/><text x="372" y="174" font-size="16" fill="#3355d6" font-weight="600">Stage 2</text><text x="372" y="204" font-size="17" fill="#1c2230" font-weight="400">r₂ = y − F₁</text><text x="372" y="233" font-size="16" fill="#1c2230" font-weight="400">Fit soft tree f₂; update Q₂</text><text x="372" y="265" font-size="16" fill="#1c2230" font-weight="400">F₂(x) = F₁(x) + f₂(Q₂x)</text><rect x="676" y="145" width="292" height="144" rx="6" fill="white" stroke="#c9ccd3"/><text x="694" y="174" font-size="16" fill="#3355d6" font-weight="600">Stage K</text><text x="694" y="204" font-size="17" fill="#1c2230" font-weight="400">rₖ = y − Fₖ₋₁</text><text x="694" y="233" font-size="16" fill="#1c2230" font-weight="400">Fit soft tree fₖ; update Qₖ</text><text x="694" y="265" font-size="16" fill="#1c2230" font-weight="400">Fₖ(x) = Fₖ₋₁(x) + fₖ(Qₖx)</text><path d="M324 217H348" fill="none" stroke="#3355d6" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M646 217H670" fill="none" stroke="#3355d6" stroke-width="1.7" marker-end="url(#arrow)"/><text x="651" y="199" font-size="16" fill="#6b7180" font-weight="400">…</text><text x="32" y="330" font-size="16" fill="#434a5a" font-weight="400">Fit fₖ using Qₖ₋₁x and residuals; update Qₖ by gradient descent through the soft tree.</text><text x="32" y="354" font-size="12" fill="#6b7180" font-weight="400">The arrows indicate training order and cumulative predictions, not a tree-to-tree feature pipeline.</text></g></svg>
